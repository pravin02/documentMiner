spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:postgres}?TimeZone=Asia/Kolkata
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time-zone: "Asia/Kolkata"
        format_sql: true
---
spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
---
spring:
  bootui:
    enabled: ON
---
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG